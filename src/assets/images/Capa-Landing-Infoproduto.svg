<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Capa do projeto: landing page de infoproduto em WordPress e Elementor">
  <title>Landing page de infoproduto — WordPress + Elementor</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#2a2420"/>
    </linearGradient>
    <linearGradient id="heroImg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- marca d'agua diagonal discreta -->
  <g opacity="0.05">
    <circle cx="1060" cy="120" r="220" fill="#f59e0b"/>
    <circle cx="140" cy="640" r="180" fill="#c2410c"/>
  </g>

  <!-- ============================= mockup desktop ============================= -->
  <g filter="url(#shadow)">
    <rect x="96" y="112" width="700" height="470" rx="12" fill="#ffffff"/>

    <!-- barra do navegador -->
    <rect x="96" y="112" width="700" height="34" rx="12" fill="#e7e5e4"/>
    <rect x="96" y="134" width="700" height="12" fill="#e7e5e4"/>
    <circle cx="118" cy="129" r="5" fill="#a8a29e"/>
    <circle cx="136" cy="129" r="5" fill="#a8a29e"/>
    <circle cx="154" cy="129" r="5" fill="#a8a29e"/>
    <rect x="176" y="122" width="240" height="14" rx="7" fill="#ffffff"/>

    <!-- hero: coluna de texto -->
    <rect x="128" y="178" width="150" height="18" rx="9" fill="#fff7ed"/>
    <rect x="128" y="212" width="330" height="22" rx="6" fill="#18181b"/>
    <rect x="128" y="242" width="268" height="22" rx="6" fill="#18181b"/>
    <rect x="128" y="282" width="300" height="9" rx="4" fill="#d6d3d1"/>
    <rect x="128" y="298" width="270" height="9" rx="4" fill="#d6d3d1"/>

    <!-- hero: lista de check -->
    <g fill="#15803d">
      <circle cx="135" cy="330" r="7"/>
      <circle cx="135" cy="352" r="7"/>
      <circle cx="135" cy="374" r="7"/>
    </g>
    <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none">
      <polyline points="132,330 134.5,333 139,327"/>
      <polyline points="132,352 134.5,355 139,349"/>
      <polyline points="132,374 134.5,377 139,371"/>
    </g>
    <rect x="150" y="325" width="200" height="8" rx="4" fill="#d6d3d1"/>
    <rect x="150" y="347" width="175" height="8" rx="4" fill="#d6d3d1"/>
    <rect x="150" y="369" width="190" height="8" rx="4" fill="#d6d3d1"/>

    <!-- hero: botao de compra -->
    <rect x="128" y="402" width="212" height="44" rx="8" fill="#c2410c"/>
    <rect x="152" y="420" width="164" height="9" rx="4" fill="#ffffff" opacity="0.92"/>

    <!-- hero: imagem -->
    <rect x="492" y="178" width="272" height="204" rx="12" fill="url(#heroImg)"/>
    <g opacity="0.5" fill="#ffffff">
      <circle cx="628" cy="252" r="26"/>
      <rect x="600" y="288" width="56" height="62" rx="26"/>
    </g>

    <!-- cards de beneficio -->
    <g>
      <rect x="492" y="402" width="84" height="76" rx="8" fill="#fafaf9" stroke="#e7e5e4"/>
      <rect x="586" y="402" width="84" height="76" rx="8" fill="#fafaf9" stroke="#e7e5e4"/>
      <rect x="680" y="402" width="84" height="76" rx="8" fill="#fafaf9" stroke="#e7e5e4"/>
      <rect x="504" y="414" width="22" height="22" rx="6" fill="#fff7ed"/>
      <rect x="598" y="414" width="22" height="22" rx="6" fill="#fff7ed"/>
      <rect x="692" y="414" width="22" height="22" rx="6" fill="#fff7ed"/>
      <g fill="#d6d3d1">
        <rect x="504" y="446" width="58" height="7" rx="3"/>
        <rect x="504" y="459" width="44" height="7" rx="3"/>
        <rect x="598" y="446" width="58" height="7" rx="3"/>
        <rect x="598" y="459" width="44" height="7" rx="3"/>
        <rect x="692" y="446" width="58" height="7" rx="3"/>
        <rect x="692" y="459" width="44" height="7" rx="3"/>
      </g>
    </g>

    <!-- faixa escura de oferta -->
    <rect x="96" y="502" width="700" height="80" fill="#1c1917"/>
    <rect x="128" y="522" width="104" height="12" rx="6" fill="#f59e0b"/>
    <rect x="128" y="544" width="150" height="24" rx="6" fill="#ffffff"/>
    <rect x="620" y="528" width="144" height="36" rx="8" fill="#c2410c"/>
    <rect x="96" y="570" width="700" height="12" rx="0" fill="#1c1917"/>
  </g>

  <!-- ============================= mockup mobile ============================= -->
  <g filter="url(#shadow)">
    <rect x="828" y="196" width="244" height="440" rx="28" fill="#18181b"/>
    <rect x="838" y="206" width="224" height="420" rx="22" fill="#ffffff"/>
    <rect x="916" y="214" width="68" height="7" rx="4" fill="#18181b"/>

    <!-- hero mobile -->
    <rect x="858" y="242" width="104" height="14" rx="7" fill="#fff7ed"/>
    <rect x="858" y="268" width="170" height="16" rx="5" fill="#18181b"/>
    <rect x="858" y="290" width="138" height="16" rx="5" fill="#18181b"/>
    <rect x="858" y="320" width="184" height="8" rx="4" fill="#d6d3d1"/>
    <rect x="858" y="334" width="150" height="8" rx="4" fill="#d6d3d1"/>

    <!-- botao de largura total, como no celular -->
    <rect x="858" y="360" width="184" height="40" rx="8" fill="#c2410c"/>

    <!-- imagem mobile -->
    <rect x="858" y="414" width="184" height="114" rx="10" fill="url(#heroImg)"/>

    <!-- cards empilhados -->
    <rect x="858" y="542" width="184" height="30" rx="8" fill="#fafaf9" stroke="#e7e5e4"/>

    <!-- botao flutuante de whatsapp, verde escuro acessivel -->
    <circle cx="1018" cy="556" r="19" fill="#128c7e"/>
    <path d="M1018 546c-5.5 0-10 4.4-10 9.9 0 1.8.5 3.5 1.4 5l-1.5 5.4 5.6-1.5c1.4.8 3 1.2 4.5 1.2 5.5 0 10-4.4 10-9.9s-4.5-10.1-10-10.1zm0 18c-1.4 0-2.8-.4-4-1.1l-.3-.2-3.3.9.9-3.2-.2-.3c-.8-1.3-1.2-2.7-1.2-4.2 0-4.5 3.7-8.2 8.1-8.2 4.5 0 8.2 3.7 8.2 8.2s-3.7 8.1-8.2 8.1z" fill="#ffffff"/>

    <!-- barra fixa de oferta, so no celular -->
    <rect x="838" y="586" width="224" height="40" rx="0" fill="#1c1917"/>
    <rect x="838" y="606" width="224" height="20" rx="22" fill="#1c1917"/>
    <rect x="856" y="600" width="86" height="8" rx="4" fill="#ffffff"/>
    <rect x="960" y="594" width="84" height="22" rx="6" fill="#c2410c"/>
  </g>

  <!-- ============================= rodape da capa ============================= -->
  <g font-family="Inter, Segoe UI, Roboto, sans-serif">
    <text x="96" y="76" fill="#ffffff" font-size="34" font-weight="700">Treino em Casa 30 Dias</text>

    <!-- selo de stack -->
    <rect x="96" y="652" width="268" height="40" rx="20" fill="#c2410c"/>
    <text x="230" y="678" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">WordPress + Elementor</text>

    <!-- selo de acessibilidade -->
    <rect x="380" y="652" width="196" height="40" rx="20" fill="none" stroke="#3f3a36" stroke-width="2"/>
    <text x="478" y="678" fill="#d6d3d1" font-size="16" font-weight="700" text-anchor="middle">Contraste WCAG AA</text>

    <!-- selo de peso removido -->
    <rect x="592" y="652" width="214" height="40" rx="20" fill="none" stroke="#3f3a36" stroke-width="2"/>
    <text x="699" y="678" fill="#d6d3d1" font-size="16" font-weight="700" text-anchor="middle">110KB fora do critico</text>

    <text x="96" y="724" fill="#78716c" font-size="15">Produto ficticio, criado como peca de portfolio</text>
  </g>
</svg>
