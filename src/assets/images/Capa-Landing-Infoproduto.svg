<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Capa do projeto: landing page de infoproduto em WordPress e Elementor">
  <title>Landing page de infoproduto — WordPress + Elementor</title>

  <!--
    Proporcao 2.40 de proposito: e exatamente a do slot do modal
    (721x300), entao la a capa aparece inteira, sem corte.
    No card a proporcao e 1.83, e o object-fit: cover corta cerca de
    142px de cada lado. Por isso todo o conteudo essencial fica entre
    x=150 e x=1050, que e a zona segura.
  -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#2d2621"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>

  <g opacity="0.06">
    <circle cx="1080" cy="60" r="190" fill="#f59e0b"/>
    <circle cx="130" cy="470" r="150" fill="#c2410c"/>
  </g>

  <!-- ===================== mockup desktop ===================== -->
  <g filter="url(#sh)">
    <rect x="168" y="76" width="612" height="356" rx="10" fill="#ffffff"/>

    <rect x="168" y="76" width="612" height="28" rx="10" fill="#e7e5e4"/>
    <rect x="168" y="94" width="612" height="10" fill="#e7e5e4"/>
    <circle cx="188" cy="90" r="4.5" fill="#a8a29e"/>
    <circle cx="204" cy="90" r="4.5" fill="#a8a29e"/>
    <circle cx="220" cy="90" r="4.5" fill="#a8a29e"/>
    <rect x="238" y="84" width="200" height="12" rx="6" fill="#ffffff"/>

    <!-- hero: texto -->
    <rect x="196" y="128" width="124" height="15" rx="7" fill="#fff7ed"/>
    <rect x="196" y="158" width="268" height="18" rx="5" fill="#18181b"/>
    <rect x="196" y="184" width="214" height="18" rx="5" fill="#18181b"/>
    <rect x="196" y="218" width="242" height="8" rx="4" fill="#d6d3d1"/>
    <rect x="196" y="233" width="208" height="8" rx="4" fill="#d6d3d1"/>

    <!-- hero: checks -->
    <g fill="#15803d">
      <circle cx="202" cy="262" r="6.5"/>
      <circle cx="202" cy="282" r="6.5"/>
    </g>
    <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none">
      <polyline points="199,262 201,264.5 205,259.5"/>
      <polyline points="199,282 201,284.5 205,279.5"/>
    </g>
    <rect x="216" y="257" width="166" height="7" rx="3.5" fill="#d6d3d1"/>
    <rect x="216" y="277" width="140" height="7" rx="3.5" fill="#d6d3d1"/>

    <!-- hero: botao de compra -->
    <rect x="196" y="306" width="178" height="38" rx="7" fill="#c2410c"/>
    <rect x="218" y="321" width="134" height="8" rx="4" fill="#ffffff" opacity="0.92"/>

    <!-- hero: imagem -->
    <rect x="500" y="128" width="252" height="166" rx="10" fill="url(#art)"/>
    <g opacity="0.5" fill="#ffffff">
      <circle cx="626" cy="186" r="21"/>
      <rect x="603" y="215" width="46" height="52" rx="21"/>
    </g>

    <!-- grade de cards, o layout de 3 colunas -->
    <g>
      <rect x="500" y="310" width="78" height="56" rx="7" fill="#fafaf9" stroke="#e7e5e4"/>
      <rect x="587" y="310" width="78" height="56" rx="7" fill="#fafaf9" stroke="#e7e5e4"/>
      <rect x="674" y="310" width="78" height="56" rx="7" fill="#fafaf9" stroke="#e7e5e4"/>
      <rect x="511" y="320" width="18" height="18" rx="5" fill="#fff7ed"/>
      <rect x="598" y="320" width="18" height="18" rx="5" fill="#fff7ed"/>
      <rect x="685" y="320" width="18" height="18" rx="5" fill="#fff7ed"/>
      <g fill="#d6d3d1">
        <rect x="511" y="346" width="52" height="6" rx="3"/>
        <rect x="511" y="356" width="38" height="6" rx="3"/>
        <rect x="598" y="346" width="52" height="6" rx="3"/>
        <rect x="598" y="356" width="38" height="6" rx="3"/>
        <rect x="685" y="346" width="52" height="6" rx="3"/>
        <rect x="685" y="356" width="38" height="6" rx="3"/>
      </g>
    </g>

    <!-- faixa escura da oferta -->
    <rect x="168" y="380" width="612" height="52" fill="#1c1917"/>
    <rect x="196" y="394" width="88" height="10" rx="5" fill="#f59e0b"/>
    <rect x="196" y="410" width="128" height="18" rx="5" fill="#ffffff"/>
    <rect x="640" y="396" width="118" height="30" rx="7" fill="#c2410c"/>
    <path d="M168 422h612v10H168z" fill="#1c1917"/>
  </g>

  <!-- ===================== mockup mobile ===================== -->
  <g filter="url(#sh)">
    <rect x="812" y="50" width="206" height="400" rx="24" fill="#18181b"/>
    <rect x="821" y="59" width="188" height="382" rx="18" fill="#ffffff"/>
    <rect x="886" y="66" width="58" height="6" rx="3" fill="#18181b"/>

    <rect x="840" y="92" width="88" height="12" rx="6" fill="#fff7ed"/>
    <rect x="840" y="116" width="146" height="14" rx="4" fill="#18181b"/>
    <rect x="840" y="136" width="116" height="14" rx="4" fill="#18181b"/>
    <rect x="840" y="164" width="150" height="7" rx="3.5" fill="#d6d3d1"/>
    <rect x="840" y="177" width="124" height="7" rx="3.5" fill="#d6d3d1"/>

    <!-- botao de largura total, como no celular -->
    <rect x="840" y="200" width="150" height="34" rx="7" fill="#c2410c"/>

    <rect x="840" y="248" width="150" height="96" rx="9" fill="url(#art)"/>
    <rect x="840" y="356" width="150" height="26" rx="7" fill="#fafaf9" stroke="#e7e5e4"/>

    <!-- botao flutuante de whatsapp, no verde escuro acessivel -->
    <circle cx="968" cy="368" r="17" fill="#128c7e"/>
    <path d="M968 359c-5 0-9 4-9 8.9 0 1.6.4 3.1 1.3 4.5l-1.4 4.9 5-1.4c1.3.7 2.7 1.1 4.1 1.1 5 0 9-4 9-8.9s-4-9.1-9-9.1zm0 16.2c-1.3 0-2.5-.4-3.6-1l-.3-.2-3 .8.8-2.9-.2-.3c-.7-1.2-1.1-2.4-1.1-3.8 0-4.1 3.3-7.4 7.3-7.4 4.1 0 7.4 3.3 7.4 7.4s-3.3 7.3-7.3 7.3z" fill="#ffffff"/>

    <!-- barra fixa de oferta, so no celular -->
    <rect x="821" y="404" width="188" height="37" rx="0" fill="#1c1917"/>
    <rect x="821" y="424" width="188" height="17" rx="18" fill="#1c1917"/>
    <rect x="838" y="416" width="74" height="7" rx="3.5" fill="#ffffff"/>
    <rect x="928" y="410" width="72" height="20" rx="6" fill="#c2410c"/>
  </g>

  <!-- ===================== selos ===================== -->
  <g font-family="Inter, Segoe UI, Roboto, sans-serif">
    <rect x="168" y="26" width="228" height="34" rx="17" fill="#c2410c"/>
    <text x="282" y="48" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">WordPress + Elementor</text>

    <rect x="408" y="26" width="166" height="34" rx="17" fill="none" stroke="#4a443f" stroke-width="2"/>
    <text x="491" y="48" fill="#d6d3d1" font-size="14" font-weight="700" text-anchor="middle">Contraste WCAG AA</text>

    <rect x="586" y="26" width="194" height="34" rx="17" fill="none" stroke="#4a443f" stroke-width="2"/>
    <text x="683" y="48" fill="#d6d3d1" font-size="14" font-weight="700" text-anchor="middle">110KB fora do critico</text>

    <text x="168" y="474" fill="#78716c" font-size="13">Produto ficticio, criado como peca de portfolio</text>
  </g>
</svg>
